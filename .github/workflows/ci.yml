name: ios15-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build iOS 15 IPA
        run: bash ios15_build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios15-ipa
          path: dist/*.ipa
          if-no-files-found: error
